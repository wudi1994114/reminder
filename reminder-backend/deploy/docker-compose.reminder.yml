name: reminder

services:
  reminder-backend:
    image: ${REMINDER_IMAGE:?REMINDER_IMAGE is required}
    container_name: reminder-backend
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:${REMINDER_HOST_PORT:-18080}:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL:-jdbc:postgresql://saas-postgres:5432/saas-admin?timezone=Asia/Shanghai}
      DB_USERNAME: ${DB_USERNAME:-pguser}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SCHEMA: ${DB_SCHEMA:-reminder}
      REDIS_HOST: ${REDIS_HOST:-saas-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: ${REDIS_DATABASE:-9}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-2592000000}
      FRONTEND_URL: ${FRONTEND_URL:-https://wwmty.cn}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://wwmty.cn,https://www.wwmty.cn}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?WECHAT_APP_ID is required}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?WECHAT_APP_SECRET is required}
      WECHAT_NOTIFICATION_TEMPLATE_ID: ${WECHAT_NOTIFICATION_TEMPLATE_ID:-}
      SAAS_STORAGE_BASE_URL: ${SAAS_STORAGE_BASE_URL:-http://saas-admin-backend:8080}
      SAAS_STORAGE_APP_CODE: beiwangji
      SAAS_STORAGE_APP_ID: ${SAAS_STORAGE_APP_ID:?SAAS_STORAGE_APP_ID is required}
      SAAS_STORAGE_SECRET_CODE: ${SAAS_STORAGE_SECRET_CODE:?SAAS_STORAGE_SECRET_CODE is required}
      SAAS_STORAGE_BIZ_DIR: ${SAAS_STORAGE_BIZ_DIR:-avatars}
      SAAS_STORAGE_MAX_SIZE_BYTES: ${SAAS_STORAGE_MAX_SIZE_BYTES:-5242880}
      NACOS_ENABLED: ${NACOS_ENABLED:-false}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-saas-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-reminder}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      TENCENT_CLOUD_SECRET_ID: ${TENCENT_CLOUD_SECRET_ID:-}
      TENCENT_CLOUD_SECRET_KEY: ${TENCENT_CLOUD_SECRET_KEY:-}
    networks:
      - saas-app
      - saas-middleware
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 4

networks:
  saas-app:
    external: true
    name: saas-app
  saas-middleware:
    external: true
    name: saas-middleware
